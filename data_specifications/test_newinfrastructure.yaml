- field: participant_id
  required: true
  type: numeric
  format: unrestricted
  NA_allowed: false
  allow_decimals: no

- field: condition
  required: true
  type: options
  options:
    - "yes"
    - "no"
  NA_allowed: false

- field: age
  required: true
  type: numeric
  format: restricted
  lowerlimit: 3
  upperlimit: 5
  NA_allowed: false
  allow_decimals: no